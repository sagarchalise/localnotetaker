name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      FOUNDRY_LOCAL_RUNTIME_VERSION: '2.1.0'
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release -p mynotetaker

      - name: Package
        shell: pwsh
        run: |
          $name = "MyNoteTaker-${{ github.ref_name }}-windows-x64"
          $dist = "dist/$name"
          New-Item -ItemType Directory -Force $dist | Out-Null
          Copy-Item target/release/MyNoteTaker.exe $dist
          $dll = Get-ChildItem target/release/build -Recurse -Filter foundry_local.dll | Select-Object -First 1
          if (-not $dll) { throw 'foundry_local.dll not found' }
          Copy-Item "$($dll.DirectoryName)/*.dll" $dist
          Copy-Item installer/install.ps1, installer/uninstall.ps1 $dist
          Copy-Item README.md $dist
          Compress-Archive -Path $dist -DestinationPath "dist/$name.zip" -Force

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true

      - name: Upload artifact (manual runs)
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: MyNoteTaker-windows-x64
          path: dist/*.zip
