name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      FOUNDRY_LOCAL_RUNTIME_VERSION: '2.1.0'
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Version
        id: ver
        shell: pwsh
        run: |
          $v = (Select-String -Path app/Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          "v=$v" >> $env:GITHUB_OUTPUT

      - name: Build
        run: cargo build --release -p mynotetaker

      - name: Package
        shell: pwsh
        run: |
          $name = "MyNoteTaker-v${{ steps.ver.outputs.v }}.${{ github.run_number }}-windows-x64"
          $dist = "dist/$name"
          New-Item -ItemType Directory -Force $dist | Out-Null
          Copy-Item target/release/MyNoteTaker.exe $dist
          $dll = Get-ChildItem target/release/build -Recurse -Filter foundry_local.dll | Select-Object -First 1
          if (-not $dll) { throw 'foundry_local.dll not found' }
          Copy-Item "$($dll.DirectoryName)/*.dll" $dist
          Copy-Item installer/install.ps1, installer/uninstall.ps1 $dist
          Copy-Item README.md $dist
          Compress-Archive -Path $dist -DestinationPath "dist/$name.zip" -Force

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.v }}.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          files: dist/*.zip
          generate_release_notes: true
