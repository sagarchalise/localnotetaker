name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    env:
      FOUNDRY_LOCAL_RUNTIME_VERSION: '2.1.0'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy -p mynotetaker --release -- -D warnings
      - run: cargo build --release -p mynotetaker
